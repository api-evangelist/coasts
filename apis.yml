aid: coasts
name: Coasts
description: >-
  Coasts (Containerized Hosts) is an open-source, MIT-licensed CLI tool that provides
  localhost service isolation and orchestration for git worktrees. It spawns multiple
  fully isolated development runtimes for the same project on a single machine, giving
  each worktree its own ports, databases, and services so parallel AI coding agents
  (Claude Code, Cursor, Codex, Conductor, and others) can build and test side by side
  without clashing. Built on Docker Compose, with a thin CLI client talking to a local
  coastd daemon over a unix socket plus a bundled React/Vite web observability UI, Coasts
  is local-first and offline-capable, with optional extension to remote machines over SSH.
  Backed by Y Combinator (Fall 2025) and founded by Jamie Sunderland and Dan Hyman.
